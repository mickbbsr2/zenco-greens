    <path d="M32 32 C32 20 22 14 18 16 C16 24 24 28 32 30" fill="url(#leafGrad)"/>
    <path d="M32 32 C32 18 42 12 46 14 C48 22 40 28 32 30" fill="#4ade80"/>
    <circle cx="26" cy="34" r="1.5" fill="#fef08a"/>
    <circle cx="38" cy="34" r="1.5" fill="#fef08a"/>
    <line x1="32" y1="30" x2="32" y2="46" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Text Brand -->
  <g transform="translate(86, 26)">
    <text x="0" y="18" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="url(#zencoGrad)" letter-spacing="-0.5">
      ZENCO <tspan fill="#22c55e">GREENS</tspan>
    </text>
    <text x="1" y="36" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" letter-spacing="1.2">
